<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Untuk Nur Fadilah</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bg"><canvas id="cityCanvas"></canvas><div class="city-glow"></div></div>

<button class="home-btn" id="homeBtn" aria-label="Keluar / Kembali ke Beranda" title="Keluar">
  <svg viewBox="0 0 24 24">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>
  </svg>
</button>

<audio id="bgm" loop preload="auto"></audio>

<div id="stage">

  <section class="scene active" id="scene-envelope">
    <div class="envlope-wrapper" id="envWrapper">
      <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="seal-heart"></div>
        <div class="letter">
          <div class="message">
            <p>Teruntuk<br>Kamuuu 🥳</p>
          </div>
        </div>
        <div class="hearts">
          <div class="heart a1"></div>
          <div class="heart a2"></div>
          <div class="heart a3"></div>
        </div>
      </div>
    </div>
    <button class="open-btn" id="openBtn">Buka <span>💌</span></button>
  </section>

  <section class="scene" id="scene-photo">
    <div class="photo-frame" id="photoFrame">
      <img id="photoImg" src="https://feeldreams.github.io/emawh.gif"/>
    </div>
    <div class="photo-caption">Happy Birthday.! &lt;3</div>
  </section>

  <section class="scene card-scene" id="scene-card">
    <div class="card" id="card">
      <div class="avatar-circle" id="avatar"></div>
      <h2 class="title-line" id="titleLine"></h2>
      <div class="msg-box" id="msgBox"></div>
      <button class="show-finale-btn" id="showFinaleBtn">Lihat Kembali foto</button>
    </div>
  </section>

</div>

<div id="finale">
  <button class="close-btn" id="closeFinaleBtn" aria-label="Tutup Layar Finale">×</button>
  <img src="https://lh3.googleusercontent.com/u/0/d/1wpkxxcvNvyXZyQJShWseQs3Yo-2VynnY" alt="Cake" class="cake-frame">
  <div class="hbd-word">
    <span>H</span><span>A</span><span>P</span><span>P</span><span>Y</span>&nbsp;<span>B</span><span>I</span><span>R</span><span>T</span><span>H</span><span>D</span><span>A</span><span>Y</span>
  </div>
  <div class="wish-text" id="wishText">Wish you all the best! &lt;3</div>
</div>

<script src="script.js"></script>
</body>
</html>
